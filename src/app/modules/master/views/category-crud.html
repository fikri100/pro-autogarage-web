<div class="page-container">
  
  <!-- Header -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Master Data — Kategori Produk &amp; Jasa</h2>
      <p class="page-subtitle">Kelola klasifikasi kategori inventaris, stok produk sparepart, dan jenis jasa layanan bengkel.</p>
    </div>
    <button mat-flat-button color="primary" class="btn-primary" (click)="showAddDialog()">
      <mat-icon class="icon-mr-0-35">add_circle</mat-icon>
      TAMBAH KATEGORI
    </button>
  </div>

  <!-- CATEGORIES LIST -->
  <div class="admin-panel-card flex flex-col">
    <div class="card-header-responsive">
      <span class="card-header-title">Daftar Kategori Aktif</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-search-input search-field-md">
        <mat-icon matPrefix class="icon-prefix-slate">search</mat-icon>
        <input matInput placeholder="Cari kategori..." (keyup)="applyFilter($event)">
      </mat-form-field>
    </div>

    <div class="admin-table-container">
      <div *ngIf="loading" class="dialog-loading-state">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="!loading && filteredCategories.length === 0" class="table-empty-state">
        <mat-icon class="table-empty-state-icon">label</mat-icon>
        <div class="table-empty-state-title">Tidak ada kategori aktif</div>
      </div>

      <!-- Table -->
      <div *ngIf="!loading && filteredCategories.length > 0" class="table-responsive">
        <table mat-table [dataSource]="filteredCategories" class="w-full-table">
          
          <!-- Column: ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="admin-th" style="width: 60px;">ID</th>
            <td mat-cell *matCellDef="let row" class="admin-td admin-td-code-slate">
              #{{ row.id }}
            </td>
          </ng-container>

          <!-- Column: Nama Kategori -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="admin-th">Nama Kategori</th>
            <td mat-cell *matCellDef="let row" class="admin-td admin-td-bold">
              {{ row.name }}
            </td>
          </ng-container>

          <!-- Column: Aksi -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="admin-th th-center" style="width: 140px;">Aksi</th>
            <td mat-cell *matCellDef="let row" class="admin-td-actions">
              <div class="actions-wrapper">
                <button mat-icon-button (click)="showEditDialog(row); $event.stopPropagation()" matTooltip="Ubah Nama Kategori" class="btn-icon-blue">
                  <mat-icon class="icon-md">edit</mat-icon>
                </button>
                <button mat-icon-button (click)="deleteCategory(row); $event.stopPropagation()" matTooltip="Hapus Kategori" class="btn-icon-red">
                  <mat-icon class="icon-md">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row-hover cursor-pointer"
              (click)="showEditDialog(row)"></tr>
        </table>
      </div>
    </div>
  </div>

</div>
