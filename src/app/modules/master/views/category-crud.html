<div class="page-container">
  
  <!-- Header -->
  <div class="page-header" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: #1e293b; margin: 0; font-size: 1.75rem; letter-spacing: -0.02em;">Master Data — Kategori Produk & Jasa</h2>
      <p style="font-family: 'Inter', sans-serif; color: #64748b; margin: 0.25rem 0 0 0; font-size: 0.9rem;">Kelola klasifikasi kategori inventaris, stok produk sparepart, dan jenis jasa layanan bengkel.</p>
    </div>
    <button mat-flat-button color="primary" (click)="showAddDialog()"
      style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; background-color: #1e3a8a; color: #ffffff; padding: 0.6rem 1.25rem; border-radius: 8px;">
      <mat-icon style="margin-right: 0.35rem;">add_circle</mat-icon>
      TAMBAH KATEGORI
    </button>
  </div>

  <!-- CATEGORIES LIST -->
  <div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); display: flex; flex-direction: column;">
    <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid #f1f5f9; background-color: #fafafa; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: #334155; font-size: 1rem;">Daftar Kategori Aktif</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-search-input" style="width: 250px;">
        <mat-icon matPrefix style="color: #64748b; margin-right: 0.5rem;">search</mat-icon>
        <input matInput placeholder="Cari kategori..." (keyup)="applyFilter($event)">
      </mat-form-field>
    </div>

    <div style="position: relative; flex: 1; min-height: 250px;">
      <div *ngIf="loading" style="padding: 4rem; display: flex; align-items: center; justify-content: center;">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="!loading && filteredCategories.length === 0" style="padding: 5rem 2rem; text-align: center; color: #94a3b8; font-family: 'Inter', sans-serif;">
        <mat-icon style="font-size: 3rem; width: auto; height: auto; color: #cbd5e1; margin-bottom: 0.5rem;">label</mat-icon>
        <div style="font-weight: 600; color: #475569;">Tidak ada kategori aktif</div>
      </div>

      <!-- Table -->
      <div *ngIf="!loading && filteredCategories.length > 0" style="overflow-x: auto;">
        <table mat-table [dataSource]="filteredCategories" style="width: 100%;">
          
          <!-- Column: ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; padding: 1rem; color: #475569; width: 60px;">ID</th>
            <td mat-cell *matCellDef="let row" style="font-family: 'JetBrains Mono', monospace; padding: 1rem; color: #64748b; font-size: 0.85rem;">
              #{{ row.id }}
            </td>
          </ng-container>

          <!-- Column: Nama Kategori -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; padding: 1rem; color: #475569;">Nama Kategori</th>
            <td mat-cell *matCellDef="let row" style="font-family: 'Inter', sans-serif; padding: 1rem; color: #1e293b; font-weight: 600; font-size: 0.9rem;">
              {{ row.name }}
            </td>
          </ng-container>

          <!-- Column: Aksi -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; padding: 1rem; color: #475569; text-align: center; width: 140px;">Aksi</th>
            <td mat-cell *matCellDef="let row" style="padding: 0.5rem; text-align: center;">
              <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button mat-icon-button (click)="showEditDialog(row); $event.stopPropagation()" matTooltip="Ubah Nama Kategori" style="color: #3b82f6;">
                  <mat-icon style="font-size: 1.2rem; width: auto; height: auto;">edit</mat-icon>
                </button>
                <button mat-icon-button (click)="deleteCategory(row); $event.stopPropagation()" matTooltip="Hapus Kategori" style="color: #ef4444;">
                  <mat-icon style="font-size: 1.2rem; width: auto; height: auto;">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" style="border-bottom: 2px solid #e2e8f0; background-color: #f8fafc;"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"
              class="table-row-hover"
              (click)="showEditDialog(row)"
              style="border-bottom: 1px solid #f1f5f9; cursor: pointer;"></tr>
        </table>
      </div>
    </div>
  </div>

</div>
