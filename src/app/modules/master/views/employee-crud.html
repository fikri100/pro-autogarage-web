<div class="page-container">
  
  <!-- Header -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Master Data — Data Karyawan</h2>
      <p class="page-subtitle">Kelola seluruh data staf, mekanik, kasir, dan personel operasional bengkel.</p>
    </div>
    <button mat-flat-button color="primary" class="btn-primary" (click)="showAddDialog()">
      <mat-icon class="icon-mr-0-35">add_circle</mat-icon>
      TAMBAH KARYAWAN
    </button>
  </div>

  <!-- EMPLOYEES LIST -->
  <div class="admin-panel-card flex flex-col">
    <div class="card-header-responsive">
      <span class="card-header-title">Daftar Karyawan Aktif</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-search-input search-field-md">
        <mat-icon matPrefix class="icon-prefix-slate">search</mat-icon>
        <input matInput placeholder="Cari karyawan..." (keyup)="applyFilter($event)">
      </mat-form-field>
    </div>

    <div class="admin-table-container">
      <div *ngIf="loading" class="dialog-loading-state">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="!loading && employees.length === 0" class="table-empty-state">
        <mat-icon class="table-empty-state-icon">badge</mat-icon>
        <div class="table-empty-state-title">Tidak ada karyawan aktif</div>
      </div>

      <!-- Table Container with horizontal scrolling and no wrap -->
      <div *ngIf="!loading && employees.length > 0" class="table-responsive">
        <table mat-table [dataSource]="employees" class="w-full-table table-min-600">
          
          <!-- Column: Nama Karyawan -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="admin-th white-space-nowrap">Nama Karyawan</th>
            <td mat-cell *matCellDef="let row" class="admin-td admin-td-bold white-space-nowrap">
              {{ row.name }}
            </td>
          </ng-container>

          <!-- Column: Jabatan -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef class="admin-th white-space-nowrap">Jabatan / Posisi</th>
            <td mat-cell *matCellDef="let row" class="admin-td text-slate-500 white-space-nowrap">
              <span class="position-badge">
                {{ row.position }}
              </span>
            </td>
          </ng-container>

          <!-- Column: Phone -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef class="admin-th white-space-nowrap">No. Telepon</th>
            <td mat-cell *matCellDef="let row" class="admin-td admin-td-phone white-space-nowrap">
              {{ row.phone }}
            </td>
          </ng-container>

          <!-- Column: Address -->
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef class="admin-th white-space-nowrap">Alamat</th>
            <td mat-cell *matCellDef="let row" class="admin-td text-slate-500 ellipsis-200 white-space-nowrap" [matTooltip]="row.address">
              {{ row.address || '-' }}
            </td>
          </ng-container>

          <!-- Column: Aksi -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="admin-th th-center white-space-nowrap" style="width: 140px;">Aksi</th>
            <td mat-cell *matCellDef="let row" class="admin-td-actions white-space-nowrap">
              <div class="actions-wrapper">
                <button mat-icon-button (click)="showEditDialog(row); $event.stopPropagation()" matTooltip="Ubah Data Karyawan" class="btn-icon-blue">
                  <mat-icon class="icon-md">edit</mat-icon>
                </button>
                <button mat-icon-button (click)="deleteEmployee(row); $event.stopPropagation()" matTooltip="Hapus Karyawan" class="btn-icon-red">
                  <mat-icon class="icon-md">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row-hover cursor-pointer"
              (click)="showEditDialog(row)"></tr>
        </table>
      </div>
      <mat-paginator 
        *ngIf="!loading && employees.length > 0" 
        [length]="totalData" 
        [pageSize]="pageSize" 
        [pageSizeOptions]="[5, 10, 25, 50]" 
        (page)="onPageChange($event)" 
        class="cursor-pointer"
        style="border-top: 1px solid #f1f5f9; font-family: 'Inter', sans-serif;">
      </mat-paginator>
    </div>
  </div>

</div>
