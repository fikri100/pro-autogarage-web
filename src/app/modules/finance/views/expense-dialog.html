<h2 mat-dialog-title class="dialog-title">
  <mat-icon class="title-icon">account_balance_wallet</mat-icon>
  <span>Catat Transaksi Kas Manual</span>
</h2>

<mat-dialog-content class="dialog-content" style="padding-top: 1rem;">
  <form [formGroup]="expenseForm">
    <div class="dialog-section">
      <div class="dialog-section-header">
        <mat-icon>tune</mat-icon>
        <span>Detail Transaksi</span>
      </div>

      <div class="form-col-wrapper">
        <label class="form-label-static">Tipe Arus Kas <span class="required">*</span></label>
        <mat-form-field appearance="outline" class="full-width">
          <input type="text" matInput formControlName="cashflowType" [matAutocomplete]="cashflowAuto" placeholder="Ketik tipe arus kas..." />
          <mat-autocomplete #cashflowAuto="matAutocomplete" [displayWith]="displayCashflowType">
            <mat-option *ngFor="let t of filteredCashflowTypes$ | async" [value]="t.value">{{ t.label }}</mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <div class="two-col-grid">
        <!-- Nominal / Amount -->
        <div class="form-col-wrapper">
          <label class="form-label-static">Nominal Rupiah (Rp) <span class="required">*</span></label>
          <mat-form-field appearance="outline">
          
          <input matInput type="number" formControlName="amount" placeholder="e.g. 500000" style="font-family: 'JetBrains Mono', monospace; font-weight: 600;" />
          <mat-icon matSuffix>payments</mat-icon>
          <mat-error *ngIf="expenseForm.get('amount')?.hasError('required')">
            Nominal wajib diisi
          </mat-error>
          <mat-error *ngIf="expenseForm.get('amount')?.hasError('min')">
            Nominal harus lebih dari 0
          </mat-error>
        </mat-form-field>
        </div>

        <!-- Kategori -->
        <div class="form-col-wrapper">
          <label class="form-label-static">Kategori <span class="required">*</span></label>
          <mat-form-field appearance="outline">
          
          <input type="text" matInput formControlName="category" [matAutocomplete]="catAuto" placeholder="Ketik kategori..." />
          <mat-autocomplete #catAuto="matAutocomplete" [displayWith]="displayCategory">
            <mat-option *ngFor="let cat of filteredCategories$ | async" [value]="cat.value">{{ cat.label }}</mat-option>
          </mat-autocomplete>
          <mat-error *ngIf="expenseForm.get('category')?.hasError('required')">
            Kategori wajib diisi
          </mat-error>
        </mat-form-field>
        </div>
      </div>

      <div class="two-col-grid">
        <!-- Tanggal -->
        <div class="form-col-wrapper">
          <label class="form-label-static">Tanggal Transaksi <span class="required">*</span></label>
          <mat-form-field appearance="outline">
          
          <input matInput [matDatepicker]="picker" formControlName="flowDate">
          <mat-hint>MM/DD/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="expenseForm.get('flowDate')?.hasError('required')">
            Tanggal wajib diisi
          </mat-error>
        </mat-form-field>
        </div>
      </div>

      <!-- Keterangan -->
      <div class="form-col-wrapper">
        <label class="form-label-static">Keterangan / Catatan</label>
        <mat-form-field appearance="outline" class="full-width">
        
        <textarea matInput formControlName="description" rows="3" placeholder="Contoh: Bayar tagihan listrik bulan Mei 2026 atau Gaji mekanik A"></textarea>
        <mat-icon matSuffix>description</mat-icon>
      </mat-form-field>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions" style="border-top: 1px solid #f1f5f9; padding: 1rem 1.5rem;">
  <button mat-stroked-button (click)="onCancel()" class="btn-cancel" style="font-family: 'Plus Jakarta Sans', sans-serif;">BATAL</button>
  <button mat-flat-button color="primary" (click)="onSave()" [disabled]="isSaving" class="btn-save" style="font-family: 'Plus Jakarta Sans', sans-serif;">
    <mat-icon>check_circle</mat-icon>
    <span>SIMPAN TRANSAKSI</span>
  </button>
</mat-dialog-actions>
