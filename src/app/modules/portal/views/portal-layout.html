<mat-sidenav-container class="layout-wrapper" autosize>
  <!-- Sidebar -->
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="layout-sidebar" style="width: 16rem; border-right: 1px solid #e2e8f0; background-color: #f8fafc;">
    <!-- Logo -->
    <div class="sidebar-logo-container" style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 1px solid #f1f5f9;">
      <div>
        <h1 class="sidebar-logo" style="margin: 0;">Bengkel Pro</h1>
        <span class="sidebar-subtitle" style="display: block; margin-top: 0.15rem;">Customer Portal</span>
      </div>
      <button mat-icon-button (click)="sidenav.close()" style="color: #64748b;" title="Sembunyikan Sidebar">
        <mat-icon style="font-size: 1.25rem; width: 1.25rem; height: 1.25rem;">chevron_left</mat-icon>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <ul class="sidebar-menu">
        <li *ngFor="let item of menuItems">
          <a [routerLink]="item.routerLink" 
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: true}"
             (click)="isMobile ? sidenav.close() : null"
             class="sidebar-menu-item">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="layout-main" style="background-color: #f1f5f9;">
    <!-- Topbar -->
    <mat-toolbar class="layout-topbar" style="background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 0 1rem; justify-content: space-between;">
      
      <div style="display: flex; align-items: center;">
        <!-- Hamburger Menu -->
        <button mat-icon-button (click)="sidenav.toggle()" style="margin-right: 1rem; color: #64748b;" title="Tampilkan/Sembunyikan Sidebar">
          <mat-icon>menu</mat-icon>
        </button>
      </div>

      <div style="display: flex; gap: 1rem; align-items: center;">
        <span style="font-size: 0.85rem; color: #64748b; font-weight: 500;">Halo, <strong style="color: #1e3a8a;">{{ customerName }}</strong></span>
        
        <!-- Profile Avatar with Menu -->
        <div class="profile-avatar" style="margin-left: 0.5rem;" [matMenuTriggerFor]="profileMenu">
          {{ getCustomerInitials() }}
        </div>
        <mat-menu #profileMenu="matMenu">
          <div style="padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 0.2rem; min-width: 160px;">
            <span style="font-family: var(--font-heading); font-weight: 700; font-size: 0.85rem; color: #1e293b;">
              {{ customerName }}
            </span>
            <span style="font-size: 0.65rem; color: #64748b;" class="text-xs-caps">
              PELANGGAN
            </span>
          </div>
          <button mat-menu-item routerLink="/portal/profile">
            <mat-icon style="color: #64748b;">person</mat-icon>
            <span style="color: #334155; font-weight: 600;">PROFIL SAYA</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon style="color: #ef4444;">logout</mat-icon>
            <span style="color: #ef4444; font-weight: 600;">LOGOUT</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <!-- Content Area -->
    <main class="layout-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
