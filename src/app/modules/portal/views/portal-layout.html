<mat-sidenav-container class="layout-wrapper" autosize>
  <!-- Sidebar -->
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="layout-sidebar portal-sidebar">
    <!-- Logo -->
    <div class="sidebar-logo-container portal-sidebar-logo-container">
      <div>
        <h1 class="sidebar-logo margin-0">Bengkel Pro</h1>
        <span class="sidebar-subtitle block-mt-xs">Customer Portal</span>
      </div>
      <button mat-icon-button (click)="sidenav.close()" class="icon-color-muted" title="Sembunyikan Sidebar">
        <mat-icon class="icon-inline-lg">chevron_left</mat-icon>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <ul class="sidebar-menu">
        <li *ngFor="let item of menuItems">
          <a [routerLink]="item.routerLink" 
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: true}"
             (click)="isMobile ? sidenav.close() : null"
             class="sidebar-menu-item">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="layout-main portal-main-content">
    <!-- Topbar -->
    <mat-toolbar class="layout-topbar portal-topbar">
      
      <div class="flex-center">
        <!-- Hamburger Menu -->
        <button mat-icon-button (click)="sidenav.toggle()" class="mr-1-color-slate" title="Tampilkan/Sembunyikan Sidebar">
          <mat-icon>menu</mat-icon>
        </button>
      </div>

      <div class="flex-center-gap-4">
        <span class="halo-text">Halo, <strong class="text-color-primary-dark">{{ customerName }}</strong></span>
        
        <!-- Profile Avatar with Menu -->
        <div class="profile-avatar ml-0-5" [matMenuTriggerFor]="profileMenu">
          {{ getCustomerInitials() }}
        </div>
        <mat-menu #profileMenu="matMenu">
          <div class="portal-profile-menu-header">
            <span class="portal-profile-menu-name">
              {{ customerName }}
            </span>
            <span class="text-xxs-muted text-xs-caps">
              PELANGGAN
            </span>
          </div>
          <button mat-menu-item routerLink="/portal/profile">
            <mat-icon class="icon-color-muted">person</mat-icon>
            <span class="text-semibold-slate">PROFIL SAYA</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon class="icon-color-warn">logout</mat-icon>
            <span class="text-semibold-warn">LOGOUT</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <!-- Content Area -->
    <main class="layout-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
