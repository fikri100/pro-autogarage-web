<div class="auth-page-wrapper">
  <div class="auth-card">

    <!-- Header -->
    <div class="auth-card-header">
      <div class="auth-header-icon">
        <mat-icon>directions_car</mat-icon>
      </div>
      <h2>Portal Pelanggan</h2>
      <p>Pro Auto Garage — Booking & Monitor Kendaraan Mandiri</p>
    </div>

    <!-- Form Container -->
    <div class="auth-card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

        <!-- Input: Username / No WhatsApp -->
        <div class="form-col-wrapper">
          <label class="form-label-static">Username atau Nomor WhatsApp</label>
          <mat-form-field appearance="outline" class="full-width">
            <mat-icon matPrefix class="input-prefix-icon">person</mat-icon>
            <input matInput formControlName="usernameOrPhone" placeholder="Masukkan username atau 0812..." class="input-body">
            <mat-error *ngIf="loginForm.get('usernameOrPhone')?.hasError('required')">
              Username atau nomor WhatsApp wajib diisi
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Input: Password -->
        <div class="form-col-wrapper">
          <div class="flex-space-between">
            <label class="form-label-static">Kata Sandi</label>
          </div>
          <mat-form-field appearance="outline" class="full-width">
            <mat-icon matPrefix class="input-prefix-icon">lock</mat-icon>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Masukkan password Anda" class="input-body">
            <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Toggle password visibility'">
              <mat-icon class="input-suffix-icon">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password wajib diisi
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Action Button -->
        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || loading"
          class="btn-portal-submit">
          <mat-spinner diameter="20" *ngIf="loading" color="warn"></mat-spinner>
          <span>{{ loading ? 'MASUK...' : 'MASUK KE PORTAL' }}</span>
        </button>

        <!-- Divider & Footer Link -->
        <div class="auth-footer-divider">
          <span>Belum terdaftar? </span>
          <a routerLink="/portal/register">Daftar Mandiri Di Sini</a>
        </div>

      </form>
    </div>

  </div>
</div>
