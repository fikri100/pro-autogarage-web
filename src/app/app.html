<ng-container *ngIf="isLoggedIn() && !isPortalRoute(); else loginTemplate">
  <mat-sidenav-container class="layout-wrapper" autosize>

    <!-- Sidebar -->
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="layout-sidebar app-sidebar">
      <!-- Logo -->
      <div class="sidebar-logo-container app-sidebar-logo-container">
        <div>
          <h1 class="sidebar-logo margin-0">Bengkel Pro</h1>
          <span class="sidebar-subtitle block-mt-xs">Professional Edition</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li *ngFor="let item of menuItems">

            <!-- Item without children -->
            <a *ngIf="!item.children || item.children.length === 0" [routerLink]="item.routerLink"
              routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}"
              (click)="isMobile ? sidenav.close() : null" class="sidebar-menu-item">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </a>

            <!-- Item with children -->
            <div *ngIf="item.children && item.children.length > 0" class="sidebar-menu-group">
              <a (click)="item.isOpen = !item.isOpen" class="sidebar-menu-item sidebar-menu-parent-item">
                <div class="flex-center-gap-xs">
                  <i [class]="item.icon"></i>
                  <span>{{ item.label }}</span>
                </div>
                <mat-icon class="submenu-chevron" [style.transform]="item.isOpen ? 'rotate(90deg)' : 'rotate(0deg)'">
                  chevron_right
                </mat-icon>
              </a>

              <!-- Child Menu List -->
              <ul *ngIf="item.isOpen" class="sidebar-submenu sidebar-submenu-list">
                <li *ngFor="let child of item.children">
                  <a [routerLink]="child.routerLink" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    (click)="isMobile ? sidenav.close() : null" class="sidebar-menu-item submenu-item">
                    <i [class]="child.icon"></i>
                    <span>{{ child.label }}</span>
                  </a>
                </li>
              </ul>
            </div>

          </li>
        </ul>
      </nav>
    </mat-sidenav>

    <!-- Main Content -->
    <mat-sidenav-content class="layout-main app-main-content">
      <!-- Topbar -->
      <mat-toolbar class="layout-topbar">

        <div class="topbar-left">
          <!-- Hamburger Menu (Always Visible for Hide/Show Sidebar) -->
          <button mat-icon-button (click)="sidenav.toggle()" class="mr-1-color-slate" title="Tampilkan/Sembunyikan Sidebar">
            <mat-icon>menu</mat-icon>
          </button>
        </div>

        <div class="topbar-right">
          <button mat-icon-button class="btn-bell-cog">
            <i class="pi pi-bell icon-bell-cog"></i>
          </button>
          <button mat-icon-button class="btn-bell-cog">
            <i class="pi pi-cog icon-bell-cog"></i>
          </button>

          <!-- Profile Avatar with Menu -->
          <div class="profile-avatar ml-0-5" [matMenuTriggerFor]="profileMenu">
            {{ getUserInitials() }}
          </div>
          <mat-menu #profileMenu="matMenu">
            <div class="portal-profile-menu-header">
              <span class="portal-profile-menu-name">
                {{ getEmployeeName() }}
              </span>
              <span class="text-xxs-muted text-xs-caps">
                {{ getRoleName() }}
              </span>
            </div>
            <button mat-menu-item (click)="logout()">
              <mat-icon class="icon-color-warn">logout</mat-icon>
              <span class="text-semibold-warn">LOGOUT</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>

      <!-- Content Area -->
      <main class="layout-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>
</ng-container>

<ng-template #loginTemplate>
  <router-outlet></router-outlet>
</ng-template>
