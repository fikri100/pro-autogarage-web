<ng-container *ngIf="isLoggedIn() && !isPortalRoute(); else loginTemplate">
  <mat-sidenav-container class="layout-wrapper" autosize>

    <!-- Sidebar -->
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="layout-sidebar"
      style="width: 16rem; border-right: 1px solid #e2e8f0; background-color: #f8fafc;">
      <!-- Logo -->
      <div class="sidebar-logo-container"
        style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 1px solid #f1f5f9;">
        <div>
          <h1 class="sidebar-logo" style="margin: 0;">Bengkel Pro</h1>
          <span class="sidebar-subtitle" style="display: block; margin-top: 0.15rem;">Professional Edition</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li *ngFor="let item of menuItems">

            <!-- Item without children -->
            <a *ngIf="!item.children || item.children.length === 0" [routerLink]="item.routerLink"
              routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}"
              (click)="isMobile ? sidenav.close() : null" class="sidebar-menu-item">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </a>

            <!-- Item with children -->
            <div *ngIf="item.children && item.children.length > 0" class="sidebar-menu-group">
              <a (click)="item.isOpen = !item.isOpen" class="sidebar-menu-item"
                style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding-right: 1.25rem;">
                <div style="display: flex; align-items: center; gap: 0.875rem;">
                  <i [class]="item.icon"></i>
                  <span>{{ item.label }}</span>
                </div>
                <mat-icon
                  style="font-size: 1.15rem; width: 1.15rem; height: 1.15rem; margin: 0; transition: transform 0.2s;"
                  [style.transform]="item.isOpen ? 'rotate(90deg)' : 'rotate(0deg)'">
                  chevron_right
                </mat-icon>
              </a>

              <!-- Child Menu List -->
              <ul *ngIf="item.isOpen" class="sidebar-submenu"
                style="list-style: none; padding: 0.25rem 0 0.5rem 0; display: flex; flex-direction: column; gap: 0.25rem;">
                <li *ngFor="let child of item.children">
                  <a [routerLink]="child.routerLink" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    (click)="isMobile ? sidenav.close() : null" class="sidebar-menu-item submenu-item">
                    <i [class]="child.icon"></i>
                    <span>{{ child.label }}</span>
                  </a>
                </li>
              </ul>
            </div>

          </li>
        </ul>
      </nav>
    </mat-sidenav>

    <!-- Main Content -->
    <mat-sidenav-content class="layout-main" style="background-color: #f1f5f9;">
      <!-- Topbar -->
      <mat-toolbar class="layout-topbar"
        style="background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 0 1.5rem; justify-content: space-between;">

        <div style="display: flex; align-items: center;">
          <!-- Hamburger Menu (Always Visible for Hide/Show Sidebar) -->
          <button mat-icon-button (click)="sidenav.toggle()" style="margin-right: 1rem; color: #64748b;"
            title="Tampilkan/Sembunyikan Sidebar">
            <mat-icon>menu</mat-icon>
          </button>
        </div>

        <div style="display: flex; gap: 1rem; align-items: center;">
          <button mat-icon-button style="color: #94a3b8;">
            <i class="pi pi-bell" style="font-size: 1.25rem;"></i>
          </button>
          <button mat-icon-button style="color: #94a3b8;">
            <i class="pi pi-cog" style="font-size: 1.25rem;"></i>
          </button>

          <!-- Profile Avatar with Menu -->
          <div class="profile-avatar" style="margin-left: 0.5rem;" [matMenuTriggerFor]="profileMenu">
            {{ getUserInitials() }}
          </div>
          <mat-menu #profileMenu="matMenu">
            <div
              style="padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 0.2rem; min-width: 160px;">
              <span style="font-family: var(--font-heading); font-weight: 700; font-size: 0.85rem; color: #1e293b;">
                {{ getEmployeeName() }}
              </span>
              <span style="font-size: 0.65rem; color: #64748b;" class="text-xs-caps">
                {{ getRoleName() }}
              </span>
            </div>
            <button mat-menu-item (click)="logout()">
              <mat-icon style="color: #ef4444;">logout</mat-icon>
              <span style="color: #ef4444; font-weight: 600;">LOGOUT</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>

      <!-- Content Area -->
      <main class="layout-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>
</ng-container>

<ng-template #loginTemplate>
  <router-outlet></router-outlet>
</ng-template>
